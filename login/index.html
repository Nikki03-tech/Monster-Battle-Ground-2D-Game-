<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Monster Battle Ground - Login</title>

    <link rel="stylesheet" href="styless.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >
</head>

<body>

    <div class="wrapper">

        <h1>Login</h1>

        <form id="loginForm">

            <div class="input-box">
                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >
                <i class="fa-solid fa-user"></i>
            </div>

            <div class="input-box">
                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >
                <i class="fa-solid fa-lock"></i>
            </div>

            <div class="remember-forgot">

                <label>
                    <input
                        type="checkbox"
                        id="rememberMe"
                        checked
                    >
                    Remember Me
                </label>

                <a href="#">Forgot Password?</a>

            </div>

            <button type="submit" class="btn">
                Login
            </button>

            <p id="loginMessage"></p>

            <div class="register-link">
                <p>
                    Don't have an account?
                    <a href="../signup/index.html">
                        Sign Up
                    </a>
                </p>
            </div>

        </form>

    </div>


    <script type="module">

        import {
            initializeApp
        } from
        "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


        import {
            getAuth,
            signInWithEmailAndPassword,
            setPersistence,
            browserLocalPersistence
        } from
        "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


        const firebaseConfig = {

            apiKey:
                "AIzaSyCU2wRnU-8O8Spk9AgUBBnjKMfE82GQ6Ds",

            authDomain:
                "monster-battle-ground.firebaseapp.com",

            projectId:
                "monster-battle-ground",

            storageBucket:
                "monster-battle-ground.firebasestorage.app",

            messagingSenderId:
                "569924636272",

            appId:
                "1:569924636272:web:7d99af119f2fd39dc12eb5"

        };


        const app =
            initializeApp(firebaseConfig);

        const auth =
            getAuth(app);


        const loginForm =
            document.getElementById("loginForm");

        const emailInput =
            document.getElementById("email");

        const passwordInput =
            document.getElementById("password");

        const loginMessage =
            document.getElementById("loginMessage");


        loginForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();

                const email =
                    emailInput.value.trim();

                const password =
                    passwordInput.value;

                loginMessage.textContent =
                    "Logging in...";


                try {

                    await setPersistence(
                        auth,
                        browserLocalPersistence
                    );


                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                    await auth.authStateReady();


                    if (!auth.currentUser) {
                        throw new Error(
                            "Firebase login session was not restored."
                        );
                    }


                    loginMessage.textContent =
                        "Login successful!";


                    window.location.replace(
                        "../welcome/index.html?returning=true"
                    );

                }

                catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );


                    if (
                        error.code ===
                        "auth/invalid-credential"
                    ) {

                        loginMessage.textContent =
                            "Incorrect email or password.";

                    }

                    else if (
                        error.code ===
                        "auth/user-not-found"
                    ) {

                        loginMessage.textContent =
                            "No account found with this email.";

                    }

                    else if (
                        error.code ===
                        "auth/wrong-password"
                    ) {

                        loginMessage.textContent =
                            "Incorrect password.";

                    }

                    else if (
                        error.code ===
                        "auth/invalid-email"
                    ) {

                        loginMessage.textContent =
                            "Please enter a valid email.";

                    }

                    else {

                        loginMessage.textContent =
                            "Login failed. Please try again.";

                    }

                }

            }
        );

    </script>

</body>

</html>
