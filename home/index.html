<!DOCTYPE html>
<html lang="en">
<head>
    <title>Monster Battle Ground</title>

    <link rel="stylesheet" href="home.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
          integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
          crossorigin="anonymous"
          referrerpolicy="no-referrer">
<style>
.home-button,
.back-button {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 1000;
    display: inline-block;
    padding: 10px 18px;
    color: #fff !important;
    font-weight: 800 !important;
    text-decoration: none !important;
    background: rgba(10, 20, 48, 0.92);
    border: 1px solid rgba(83, 218, 255, 0.7);
    border-radius: 8px;
    font-family: 'Poppins', sans-serif;
    transition: background 0.2s, transform 0.2s;
}

.home-button:hover,
.back-button:hover {
    color: #fff !important;
    background: #087da8;
    transform: translateY(-2px);
}
</style>
</head>

<body>

    

    <!-- HOME / HERO SECTION -->
    <section class="hero" id="home">

        <div class="main-width">

            <header>

                <div class="logo">
                    <h2>
                        <a href="#home">Game On</a>
                    </h2>
                </div>

                <nav>
                    <ul>
                        <li>
                            <a href="about.html">About Game</a>
                        </li>

                        <li>
                            <a href="reviews.html">Reviews</a>
                        </li>

                        <li>
                            <a href="faqs.html">FAQs</a>
                        </li>
                    </ul>
                </nav>

            </header>

            <div class="content">

                <div class="main-text">

                    

                    <h3>Epic Game</h3>

                    <h1>MBG</h1>

                    <h4>MONSTER BATTLE GROUND</h4>

                    <p>Where Fight Never Ends</p>

                    <a class="start-button" href="../signup/index.html" id="playNowButton">
                        Play Now
                    </a>

                </div>

            </div>

        </div>

    </section>



    <!-- Request the persistent player's music on the first user interaction. -->
    <script>
        function requestPersistentMusic() {
            if (window.parent !== window) {
                window.parent.postMessage(
                    { type: "mbg-start-music" },
                    window.location.origin
                );
            }
        }

        document.addEventListener(
            "pointerdown", requestPersistentMusic, { once: true }
        );
        document.addEventListener(
            "keydown", requestPersistentMusic, { once: true }
        );
    </script>

<style id="force-white-home-buttons">
a.home-button,
a.back-button,
a.home,
a.back,
a.home-link,
a.back-link {
    color: #ffffff !important;
    -webkit-text-fill-color: #ffffff !important;
    font-weight: 800 !important;
    text-decoration: none !important;
}
</style>

</body>
</html>
