<!DOCTYPE html>
<html lang="en">
<head>
    <title>Monster Battle Ground</title>

    <link rel="stylesheet" href="home.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
          integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
          crossorigin="anonymous"
          referrerpolicy="no-referrer">
</head>

<body>

    <audio
        id="globalMusic"
        src="../audio/music/space-bgm.mp3"
        loop
        preload="auto">
    </audio>

    <script>
        const globalMusic = document.getElementById("globalMusic");

        function startGlobalMusic() {
            if (!globalMusic) return;

            globalMusic.volume = 0.7;

            const promise = globalMusic.play();

            if (promise !== undefined) {
                promise.catch(() => {
                    console.log("Music will start after user interaction.");
                });
            }
        }

        document.addEventListener(
            "pointerdown",
            startGlobalMusic,
            { once: true }
        );

        document.addEventListener(
            "keydown",
            startGlobalMusic,
            { once: true }
        );
    </script>

    <!-- HOME / HERO SECTION -->
    <section class="hero" id="home">

        <div class="main-width">

            <header>

                <div class="logo">
                    <h2>
                        <a href="#home">Game On</a>
                    </h2>
                </div>

                <nav>
                    <ul>
                        <li>
                            <a href="about.html">About Game</a>
                        </li>

                        <li>
                            <a href="reviews.html">Reviews</a>
                        </li>

                        <li>
                            <a href="faqs.html">FAQs</a>
                        </li>
                    </ul>
                </nav>

            </header>

            <div class="content">

                <div class="main-text">

                    <h6>#1 Trending</h6>

                    <h3>Epic Game</h3>

                    <h1>MBG</h1>

                    <h4>MONSTER BATTLE GROUND</h4>

                    <p>Where Fight Never Ends</p>

                    <a class="start-button" href="../signup/index.html" id="playNowButton">
                        Play Now
                    </a>

                </div>

            </div>

        </div>

    </section>



    <!-- HOME PAGE MUSIC -->
    <audio
        id="homeMusic"
        src="../audio/music/space-bgm.mp3"
        loop
        preload="auto">
    </audio>

    <script>
        const playNowButton =
            document.getElementById("playNowButton");

        const homeMusic =
            document.getElementById("homeMusic");

        playNowButton.addEventListener("click", () => {

            homeMusic.volume = 0.7;

            homeMusic.play()
                .then(() => {
                    console.log("🎵 Music started from Play Now");
                })
                .catch((error) => {
                    console.log(
                        "Music could not start:",
                        error
                    );
                });

        });
    </script>

</body>
</html>
