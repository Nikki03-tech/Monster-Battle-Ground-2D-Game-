<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Monster Battle Ground - Sign Up</title>

    <link rel="stylesheet" href="styless.css">

</head>


<body>

    <div class="container">

        <h1>Create Account</h1>


        <form id="signupForm">


            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >


            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >


            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >


            <label>

                <input
                    type="checkbox"
                    id="rememberMe"
                    checked
                >

                Remember Me

            </label>


            <button type="submit">
                Sign Up
            </button>


            <p id="signupMessage"></p>

        </form>


        <p>

            Already have an account?

            <a href="../login/index.html">
                Login
            </a>

        </p>

    </div>



    <script type="module">

        import {
            initializeApp
        } from
        "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


        import {
            getAuth,
            createUserWithEmailAndPassword,
            updateProfile,
            setPersistence,
            browserLocalPersistence
        } from
        "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


        import {
            getFirestore,
            doc,
            setDoc,
            serverTimestamp
        } from
        "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";



        /* =========================================
           FIREBASE
        ========================================= */

        const firebaseConfig = {
    apiKey: "AIzaSyCU2wRnU-8O8SPk9AgUBBnjKMfE82GQ6Ds",
    authDomain: "monster-battle-ground.firebaseapp.com",
    projectId: "monster-battle-ground",
    storageBucket: "monster-battle-ground.firebasestorage.app",
    messagingSenderId: "569924636272",
    appId: "1:569924636272:web:7d99af119f2fd39dc12eb5",
    measurementId: "G-Y9HEEBHBXT"
};


        const app =
            initializeApp(firebaseConfig);


        const auth =
            getAuth(app);


        const db =
            getFirestore(app);



        /* =========================================
           ELEMENTS
        ========================================= */

        const signupForm =
            document.getElementById(
                "signupForm"
            );


        const usernameInput =
            document.getElementById(
                "username"
            );


        const emailInput =
            document.getElementById(
                "email"
            );


        const passwordInput =
            document.getElementById(
                "password"
            );


        const signupMessage =
            document.getElementById(
                "signupMessage"
            );



        /* =========================================
           SIGN UP
        ========================================= */

        signupForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                const username =
                    usernameInput.value.trim();


                const email =
                    emailInput.value.trim();


                const password =
                    passwordInput.value;


                if (username.length < 2) {

                    signupMessage.textContent =
                        "Username must have at least 2 characters.";

                    return;

                }


                signupMessage.textContent =
                    "Creating your account...";


                try {

                    /*
                     * Keep login active after signup.
                     */

                    await setPersistence(
                        auth,
                        browserLocalPersistence
                    );


                    /*
                     * CREATE FIREBASE ACCOUNT
                     */

                    const userCredential =
                        await createUserWithEmailAndPassword(
                            auth,
                            email,
                            password
                        );


                    const user =
                        userCredential.user;



                    /*
                     * SAVE USERNAME TO FIREBASE AUTH
                     */

                    await updateProfile(
                        user,
                        {
                            displayName:
                                username
                        }
                    );



                    /*
                     * CREATE FIRESTORE PROFILE
                     */

                    await setDoc(
                        doc(
                            db,
                            "users",
                            user.uid
                        ),
                        {

                            username:
                                username,

                            email:
                                email,

                            avatar:
                                "default",

                            musicVolume:
                                100,

                            soundVolume:
                                100,

                            createdAt:
                                serverTimestamp()

                        }
                    );



                    signupMessage.textContent =
                        "Account created successfully!";


                    /*
                     * Go directly to Welcome.
                     */

                    window.location.replace(
                        "../welcome/index.html?returning=false"
                    );

                }

                catch (error) {

                    console.error(
                        "Signup error:",
                        error
                    );


                    if (
                        error.code ===
                        "auth/email-already-in-use"
                    ) {

                        signupMessage.textContent =
                            "This email already has an account. Please login.";

                    }

                    else if (
                        error.code ===
                        "auth/invalid-email"
                    ) {

                        signupMessage.textContent =
                            "Please enter a valid email.";

                    }

                    else if (
                        error.code ===
                        "auth/weak-password"
                    ) {

                        signupMessage.textContent =
                            "Password must contain at least 6 characters.";

                    }

                    else {

                        signupMessage.textContent =
                            "Unable to create account. Please try again.";

                    }

                }

            }
        );

    </script>

</body>

</html>
