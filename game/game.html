<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster Battle Ground</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="canvas1"></canvas>
    <div class="controls">
        <button id="upButton">Up</button>
        <button id="downButton">Down</button>
        <button id="shootButton">Shoot</button>
    </div>
    <img id="player" src="player.png" alt="Player character">
    <img id="angler1" src="angler1.png" alt="Angler 1 enemy">
    <img id="angler2" src="angler2.png" alt="Angler 2 enemy">
    <img id="lucky" src="lucky.png" alt="Lucky enemy">
    <img id="hivewhale" src="hivewhale.png" alt="Hivewhale enemy">
    <img id="projectile" src="projectile.png" alt="Projectile">
    <img id="gears" src="gears.png" alt="Gears">
    <img id="smokeExplosion" src="smokeExplosion.png" alt="Smoke explosion" hidden>
    <img id="fireExplosion" src="fireExplosion.png" alt="Fire explosion"hidden>
    <img id="layer1" src="layer1.png" alt="Background layer 1">
    <img id="layer2" src="layer2.png" alt="Background layer 2">
    <img id="layer3" src="layer3.png" alt="Background layer 3">
    <img id="layer4" src="layer4.png" alt="Background layer 4">

    <script src="script1.js" type="text/javascript"></script>
</body>
</html>
